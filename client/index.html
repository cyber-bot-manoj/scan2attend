<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified Campus Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'bg-primary': '#FAF8F5',
              'text-primary': '#212121',
              'text-secondary': '#757575',
              'accent-green': '#00C853',
              'accent-orange': '#FF9100',
              'accent-red': '#DD2C00',
              'accent-blue': '#2979FF',
              'border-color': '#E0E0E0',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Anti-Inspect & Code Protection: Disable Right-Click, Context Menu, DevTools shortcuts
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      }, { capture: true });

      document.addEventListener('keydown', function(e) {
        const isCtrlOrMeta = e.ctrlKey || e.metaKey;
        const key = (e.key || '').toUpperCase();
        if (
          e.key === 'F12' ||
          e.keyCode === 123 ||
          (isCtrlOrMeta && (
            (e.shiftKey && (key === 'I' || key === 'J' || key === 'C')) ||
            key === 'U' ||
            key === 'S'
          ))
        ) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, { capture: true });

      document.addEventListener('dragstart', function(e) {
        if (e.target && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
